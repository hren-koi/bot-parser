name: Broadcast Bot

on:
  schedule:
    - cron: '0 */3 * * *'   # Каждые 3 часа
  workflow_dispatch:         # Ручной запуск из Actions

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pytelegrambotapi requests

      - name: Run bot
        run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          YOUR_ID: ${{ secrets.YOUR_ID }}
          PROXY: ${{ secrets.PROXY }}

      - name: Commit updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add chats.json
          git diff --quiet && git diff --staged --quiet || git commit -m "update chats $(date +'%Y-%m-%d %H:%M')"
          git push
